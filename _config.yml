title: Vision Group
email: vision@example.edu
description: Vision Group at INSAIT 2026
# Jekyll loads configs left-to-right; later files override earlier keys.
#
# Production (GitHub Pages, default build): only _config.yml is used — set url/baseurl
# to match how the site is actually served:
#   - Custom domain at site root (e.g. https://www.example.com/) → baseurl: ""
#   - Project page (e.g. https://user.github.io/repo/) → baseurl: "/repo"
#
# Local previews (root URL, styles + links resolve correctly):
#   rake serve
#   or: bundle exec jekyll serve --config _config.yml,_config.dev.yml
#   Then open http://127.0.0.1:4000/ (or the URL printed by Jekyll).
url: "https://vision.insait.ai"
baseurl: ""

# VLab logos (assets/images/logo/)
logo:
  nav: /assets/images/logo/VLAB-logo.png
  nav_white: /assets/images/logo/vlab-white.png
  nav_large: /assets/images/logo/VLAB-logo-large.png
  nav_white_large: /assets/images/logo/vlab-white-large.png
  # INSAIT host-institute lockup ("our logo @ INSAIT")
  insait: /assets/images/logo/insait-trans.png
  insait_white: /assets/images/logo/insait-trans-white.png
  insait_url: https://insait.ai/
 
# Home page (landing-it-company style) — override in pages if needed
landing:
  hero_video: "/site-covers/home/hero-video.mp4"
  hero_title: "Building Visual Intelligence at INSAIT"
  hero_subtitle: "Vision Lab at INSAIT develops computer vision and multimodal AI systems for images, videos, and interactive visual worlds."
  primary_cta_label: "People"
  primary_cta_url: "/people/"
  secondary_cta_label: "Research topics"
  secondary_cta_url: "/research/"
  tertiary_cta_label: "INSAIT"
  tertiary_cta_url: "https://insait.ai/"
  services_kicker: "Research directions"
  services_heading: "Our strategic research direction."
  recent_projects_kicker: "Projects & demo"
  recent_projects_heading: "Recent projects"
  recent_projects_limit: 10
  join_us:
    enabled: true
    kicker: "Careers · open positions"
    heading: "Join us"
    body: >-
      We are recruiting PhD students, postdocs, and visiting researchers
      across all our directions. If our work resonates with yours, come
      build the next generation of vision systems with us.
    cta_label: "View open positions"
    cta_url: "/openings/"
    images:
      - /assets/images/INSAIT/1765184093836.jpeg
      - /assets/images/INSAIT/1776151789707.jpeg
      - /assets/images/INSAIT/synergy.jpg

# Optional: shown on the home page below research cards
sponsors:
  - name: Adobe
    logo: /site-covers/sponsors/Adobe_Inc.png
  - name: Snap
    logo: /site-covers/sponsors/Snap_Inc.png
  - name: Google
    logo: /site-covers/sponsors/google.png
  - name: Vivo
    logo: /site-covers/sponsors/Vivo.png
  - name: Toyota
    logo: /site-covers/sponsors/Toyota.png
  - name: Netflix
    logo: /site-covers/sponsors/Netflix.png
  - name: European Union
    logo: /assets/images/client-logo/eu_funded_en-modified.png

# Site footer (also in _data/footer.yml; _includes/footer.html prefers _data)
footer:
  columns:
    - title: Research
      links:
        - label: Research directions
          url: /research/
        - label: Projects & Demo
          url: /demos/
        - label: Publications
          url: /publications/
    - title: Group
      links:
        - label: People
          url: /people/
        - label: Open positions
          url: /openings/
        - label: Sponsorship
          url: /sponsorship/
    - title: Resources
      links:
        - label: Home
          url: /
        - label: INSAIT
          url: https://insait.ai/
          external: true
  aside:
    title: Contact
    body: >-
      For collaboration, student visits, and sponsorship enquiries, please reach out to our faculty group directly.
    cta:
      label: Meet the faculty
      url: /people/#faculty
    show_email: false

# External brand logos (used by person link buttons, etc.)
# Faculty cards / person pages render this logo inside the "INSAIT profile"
# button. Falls back to a plain "IN" text glyph if unset.
links:
  insait_logo: /assets/images/logo/insait-trans-small.png

markdown: kramdown
permalink: pretty

collections:
  people:
    output: true
    permalink: /people/:path/
  research_topics:
    output: true
    permalink: /research/topics/:path/
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /demos/:path/
  jobs:
    output: true
    permalink: /openings/:path/

defaults:
  - scope:
      path: ""
      type: "people"
    values:
      layout: person
  - scope:
      path: ""
      type: "research_topics"
    values:
      layout: topic
  - scope:
      path: ""
      type: "publications"
    values:
      layout: publication
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "jobs"
    values:
      layout: job
exclude:
  - template
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - data
  - .venv-face
  - .venv
