- date: '2025-06-13'
  body: '[SceneSplat](/demos/scenesplat/) is released for instant 3D object discovery
    from text in photorealistic Gaussian-splat scenes. The system enables open-vocabulary
    interaction directly in 3D space.'
  link_url: https://insait.ai/insait-and-collaborators-launch-scenesplat-a-breakthrough-in-open-vocabulary-3d-scene-understanding/
- date: '2025-06-09'
  body: '[EarthMind](https://insait.ai/insait-unveils-earthmind-a-pioneering-ai-model-for-earth-observation/)
