# Vision Lab news feed (used by /news/)
# body: Markdown (inline links to people, demos, publications)
- date: '2026-08-13'
  body: >-
    [Mario Markov](/people/mario-markov/) discusses [FireScope](/demos/firescope/)
    on Bulgarian National Radio, covering how the wildfire-risk platform is evolving
    into a long-term prevention and decision-support tool. FireScope is now available
    in Bulgarian and 42 additional languages across Europe and Asia.
  link_url: https://insait.ai/how-can-ai-help-us-better-understand-and-prevent-wildfire-risk/
- date: '2026-06-08'
  body: >-
    INSAIT [showcases 17 accepted papers at CVPR 2026](https://insait.ai/insait-showcases-17-accepted-papers-and-emerging-ai-research-at-cvpr-2026/)
    at booth #440 in Denver, with live demos across robotics, spatial reasoning, earth
    observation, egocentric vision, visual agents, and visual media.
  link_url: https://insait.ai/insait-showcases-17-accepted-papers-and-emerging-ai-research-at-cvpr-2026/
- date: '2026-05-27'
  body: INSAIT announces [17 papers at CVPR 2026](https://insait.ai/insait-among-europes-top-institutions-at-cvpr-2026/),
    its strongest computer-vision presence so far. The accepted work spans robotics,
    spatial reasoning, egocentric vision, earth observation, visual agents, and agentic
    vision.
  link_url: https://insait.ai/insait-among-europes-top-institutions-at-cvpr-2026/
- date: '2026-05-20'
  body: '[Nikolay Nikolov](/people/nikolay-nikolov/) presents INSAIT''s latest Physical
    AI work at Google Cloud Day Sofia, focusing on systems that scale beyond robots
    trained only from demonstrations.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7462758282538176512/
- date: '2026-05-12'
  body: Bulgarian government ministers visit INSAIT and meet the Computer Vision group
    leadership, including [Luc Van Gool](/people/luc-van-gool/), to discuss the institute's
    next stage of development and strategic role for Bulgaria.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7459865655576600576/
- date: '2026-04-30'
  body: '[Asen Nachkov](/people/asen-nachkov/) discusses autonomous-vehicle research
    and [DiffSim Trinity](/demos/diffsim-trinity/) in Bulgarian media. The work studies
    differentiable simulation as a path toward safer, more data-efficient autonomous
    driving.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7455523842334203905/
- date: '2026-04-23'
  body: Lorenzo Venturoli joins INSAIT for a Master's thesis in 3D computer vision,
    bringing experience in 3D semantics, SLAM, and multimodal benchmarks.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7452986614546456576/
- date: '2026-04-21'
  body: '[EgoNight](/demos/egonight/) is released at ICLR 2026 as a benchmark for
    nighttime egocentric vision. The project introduces aligned day-night videos,
    nighttime VQA, depth estimation, and cross-illumination retrieval to test vision
    systems beyond daytime conditions.'
  link_url: https://insait.ai/insait-introduces-egonight-a-benchmark-for-egocentric-ai-vision-in-low-light-conditions/
- date: '2026-04-10'
  body: '[Anna-Maria Halacheva](/people/anna-maria-halacheva/) discusses Articulate3D,
    robotics, and her research path on the Superhuman podcast with Georgi Nenov.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7448269480448757760/
- date: '2026-04-08'
  body: '[VOID](/demos/void/) is launched in collaboration with Netflix as an open
    model for video object and interaction deletion. The model removes objects while
    reconstructing physically plausible scene dynamics rather than only filling pixels.'
  link_url: https://insait.ai/insait-and-netflix-develop-ai-model-that-realistically-removes-objects-from-video/
- date: '2026-03-31'
  body: '[Hongyu An](/people/hongyu-an/) joins INSAIT as a PhD student in Computer
    Vision with [Luc Van Gool](/people/luc-van-gool/) and [Jinjin Gu](/people/jinjin-gu/).
    His work focuses on image/video super-resolution, restoration, and generative
    diffusion models.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7444645195289280513/
- date: '2026-03-25'
  body: '[Mengshun Hu](/people/mengshun-hu/) joins INSAIT as a postdoctoral researcher
    in Computer Vision. His research focuses on video restoration, space-time video
    super-resolution, and emerging VideoAgent systems.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7442489517087031297/
- date: '2026-03-16'
  body: INSAIT announces 8 accepted ICLR 2026 papers, placing Bulgaria first in Eastern
    Europe by accepted publications at the conference. Several of the accepted works
    connect to vision, multimodal AI, and embodied reasoning.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7439235939564105728/
- date: '2026-02-25'
  body: '[Taewoo Kim](/people/taewoo-kim/) joins INSAIT as a postdoctoral researcher
    in Computer Vision and computational imaging. His work connects event-based cameras,
    low-light enhancement, video generation/editing, and agentic AI.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7432340644636979200/
- date: '2026-02-18'
  body: INSAIT launches the [CVPR 2026 Workshop on Agentic AI for Visual Media](/demos/aavm-cvpr-2026/),
    led by [Jinjin Gu](/people/jinjin-gu/) and [Lei Sun](/people/lei-sun/) in collaboration
    with Snap and Adobe. The workshop focuses on AI systems that reason, plan, and
    execute multi-step visual-media workflows.
  link_url: https://insait.ai/insait-launches-cvpr-2026-workshop-on-agentic-ai-for-visual-media/
