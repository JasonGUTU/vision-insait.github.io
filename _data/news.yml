    work is led by [Nedko Savov](/people/nedko-savov/) with collaborators including
    [Deheng Zhang](/people/deheng-zhang/), [Danda Paudel](/people/danda-paudel/),
    and [Luc Van Gool](/people/luc-van-gool/).'
  link_url: https://insait.ai/insait-researchers-advance-video-ai-with-statespacediffuser/
